<div class="min-h-screen bg-gradient-to-br from-slate-100 via-blue-50 to-slate-200 flex items-center justify-center px-4">

  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-8">

      <div
       class="mx-auto flex h-20 w-20 items-center justify-center rounded-3xl bg-blue-600 text-white text-4xl shadow-xl">

        💰

      </div>

      <h1 class="mt-5 text-4xl font-bold text-slate-800">
        Finora
      </h1>

      <p class="mt-2 text-slate-500">
        Smart Personal Finance Manager
      </p>

    </div>

    <!-- Card -->
    <div class="rounded-3xl bg-white p-10 shadow-xl border border-slate-100">

      <h2 class="text-2xl font-semibold text-slate-800">
        Welcome Back
      </h2>

      <p class="mt-1 text-sm text-slate-500">
        Sign in to continue
      </p>

      <p class="mt-3 text-slate-500">

        Manage your income, expenses,
        budgets and investments
        from one secure platform.

        </p>

      <form
        class="mt-8 space-y-5"
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()">

        <!-- Email -->

        <mat-form-field appearance="outline" class="w-full">

          <mat-label>Email</mat-label>

          <input class="ml-2"
            matInput
            type="email"
            formControlName="email">

          <mat-icon matSuffix>email</mat-icon>

        </mat-form-field>

        <!-- Password -->

        <mat-form-field appearance="outline" class="w-full">

          <mat-label>Password</mat-label>

          <input class="ml-2"
            matInput
            formControlName="password"
            [type]="hidePassword() ? 'password' : 'text'">

          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="togglePassword()">

            <mat-icon>
              {{ hidePassword() ? 'visibility_off' : 'visibility' }}
            </mat-icon>

          </button>

        </mat-form-field>

        <div class="flex items-center justify-between">

          <mat-checkbox formControlName="rememberMe">
            Remember Me
          </mat-checkbox>

          <button
            type="button"
            class="text-sm text-blue-600 hover:text-blue-700">

            Forgot Password?

          </button>

        </div>

        <button
          type="submit"
          class="h-12 w-full rounded-xl bg-blue-600 font-semibold text-white transition hover:bg-blue-700">

          Sign In

        </button>

      </form>

    </div>

    <p class="mt-6 text-center text-sm text-slate-400">
      Finora v1.0
    </p>

  </div>

</div>
