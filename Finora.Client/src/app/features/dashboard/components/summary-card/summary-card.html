<div
  class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition-all duration-200 hover:-translate-y-1 hover:shadow-md">

  <div class="mb-5 flex items-center justify-between">

    <div
      class="flex h-12 w-12 items-center justify-center rounded-xl bg-blue-100">

      <mat-icon class="text-blue-600">
        {{ icon() }}
      </mat-icon>

    </div>

  </div>

  <h3 class="text-sm font-medium text-slate-500">

    {{ title() }}

  </h3>

  <p class="mt-2 text-3xl font-bold text-slate-800">

    {{ amount() }}

  </p>

</div>
