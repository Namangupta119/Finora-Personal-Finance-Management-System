<div class="space-y-6">

  <!-- Welcome Section -->
  <section
    class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">

    <h1 class="text-3xl font-bold text-slate-800">
        👋 Welcome Back, {{ userName }}
    </h1>

    <p class="mt-2 text-slate-500">
      Here's an overview of your financial health.
    </p>

  </section>

  <section class="grid gap-6 sm:grid-cols-2 xl:grid-cols-4">

    @for(card of summaryCards; track card.title){

        <app-summary-card
            [title]="card.title"
            [amount]="card.amount"
            [icon]="card.icon">
        </app-summary-card>

    }
</section>


<section class="grid gap-6 lg:grid-cols-3">

  <!-- Income vs Expense -->

  <div
    class="lg:col-span-2 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">

    <div class="mb-6 flex items-center justify-between">

      <div>

        <h2 class="text-lg font-semibold text-slate-800">

          Income vs Expense

        </h2>

        <p class="text-sm text-slate-500">

          Last 6 months

        </p>

      </div>

    </div>

    <!-- Chart Placeholder -->

    <div
      class="flex h-80 items-center justify-center rounded-xl border-2 border-dashed border-slate-300 bg-slate-50">

      <div class="text-center">

        <div class="mb-2 text-5xl">
          📈
        </div>

        <p class="font-medium text-slate-600">
          Chart Coming Soon
        </p>

      </div>

    </div>

  </div>
    <!-- Expense Categories -->

  <div
    class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">

    <h2 class="text-lg font-semibold text-slate-800">

      Expense Categories

    </h2>

    <p class="mb-6 text-sm text-slate-500">

      Top spending

    </p>

    <div
      class="flex h-80 items-center justify-center rounded-full border-2 border-dashed border-slate-300">

      <div class="text-center">

        <div class="text-5xl">
          🥧
        </div>

        <p class="mt-2 text-slate-600">

          Pie Chart

        </p>

      </div>

    </div>

  </div>
</section>

 <section>

        <app-recent-transactions
            [transactions]="transactions">
        </app-recent-transactions>

    </section>
    
</div>
