<div
  class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition-all duration-200 hover:-translate-y-1 hover:shadow-lg">

  <!-- Icon -->

  <div
    class="mb-5 flex h-14 w-14 items-center justify-center rounded-full bg-blue-100">

    <mat-icon class="text-blue-600">

      {{ icon() }}

    </mat-icon>

  </div>

  <!-- Name -->

  <h3 class="text-lg font-semibold text-slate-800">

    {{ name() }}

  </h3>

  <!-- Type -->

  <div class="mt-3">

  @if (type() === 'Expense') {

    <span
      class="rounded-full bg-red-100 px-3 py-1 text-xs font-medium text-red-600">

      Expense

    </span>

  } @else {

    <span
      class="rounded-full bg-green-100 px-3 py-1 text-xs font-medium text-green-600">

      Income

    </span>

  }

</div>

</div>
