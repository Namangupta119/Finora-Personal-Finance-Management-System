<div class="space-y-6">

    <section
        class="flex items-center justify-between rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">

        <div>

            <h1 class="text-3xl font-bold text-slate-800">
                Categories
            </h1>

            <p class="mt-2 text-slate-500">
                Manage your income and expense categories.
            </p>

        </div>

       <button
 (click)="openAddCategoryDialog()"
class="rounded-xl bg-blue-600 px-5 py-3 font-medium text-white">

+ Add Category

</button>

    </section>

    <section
  class="flex flex-col gap-4 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm lg:flex-row lg:items-center lg:justify-between">

  <!-- Search Box -->

  <div class="relative w-full lg:max-w-md">

    <input
      type="text"
      placeholder="Search categories..."
      class="w-full rounded-xl border border-slate-300 py-3 pl-11 pr-4 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200" />

    <mat-icon
      class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">

      search

    </mat-icon>

  </div>

  <!-- Filters -->

  <div class="flex gap-3">

    <button
      class="rounded-full bg-blue-600 px-5 py-2 text-sm font-medium text-white">

      All

    </button>

    <button
      class="rounded-full border border-slate-300 px-5 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100">

      Income

    </button>

    <button
      class="rounded-full border border-slate-300 px-5 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100">

      Expense

    </button>

  </div>

</section>

<section class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">

  @for(category of categories; track category.id){

    <app-category-card

      [name]="category.name"

      [type]="category.type"

      [icon]="category.icon">

    </app-category-card>

  }

</section>

</div>
